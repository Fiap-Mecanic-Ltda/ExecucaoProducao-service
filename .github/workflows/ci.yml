name: Esteira de CI/CD - Execucao Service

# Mesmo desenho da esteira do OS Service. Este repositório cuida só da APLICAÇÃO; os manifestos
# do Kubernetes ficam em ExecucaoProducao-InfraKubernete e as tabelas em ExecucaoProducao-InfraSGBD.
#
# - PR e push em desenvolvimento, homologacao e main: build, testes (unidade, API, BDD e
#   integração com o DynamoDB Local), cobertura mínima de 80% (falha o build), SonarCloud
#   (quando houver SONAR_TOKEN) e build da imagem.
# - push em main: além disso, publica a imagem no ECR e dispara o deploy no cluster
#   (repository_dispatch no ExecucaoProducao-InfraKubernete).
# - Trava de publicação: nada vai para a AWS enquanto a Repository Variable PUBLICAR_AWS não
#   for "true" (Settings → Secrets and variables → Actions → Variables). Sem ela, o push na
#   main só roda build, testes e o build da imagem, sem push no ECR nem deploy.
on:
  push:
    branches: [main, desenvolvimento, homologacao]
  pull_request:
    branches: [main, desenvolvimento, homologacao]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  COBERTURA_MINIMA: 80
  # Precisam bater com os defaults de infra/variables.tf do ExecucaoProducao-InfraKubernete.
  AWS_REGION: us-east-1
  PROJECT_NAME: mechanicltda
  ENVIRONMENT: prod
  ECR_REPOSITORY: mechanicltda-execucao

# Sem permissões no nível do workflow: cada job declara só o que usa.
permissions: {}

jobs:
  build-and-test:
    name: Build e testes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    services:
      # Banco dos testes de integração dos repositórios (tabelas criadas e apagadas pelos testes).
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_SERVICE_URL: http://localhost:8000
      # Sem o secret (ex.: PR de fork), o Sonar é pulado com aviso; o resto da esteira roda.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'fiap-mecanic-ltda' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Fiap-Mecanic-Ltda_ExecucaoProducao-service' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # o Sonar usa o histórico para saber o que é código novo

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (SonarScanner)
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Ferramentas
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.12
          if [ -n "$SONAR_TOKEN" ]; then
            dotnet tool install --global dotnet-sonarscanner --version 12.1.0
          else
            echo "::warning::SONAR_TOKEN não configurado: análise do SonarCloud pulada."
          fi

      # tools/ fica fora da cobertura: é a CLI de carga inicial (só o Program.cs, que liga
      # serviços já testados) e nenhum projeto de teste a referencia, então ela também não
      # entra na cobertura mínima medida pelo coverlet abaixo.
      - name: Início da análise do SonarCloud
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="tests/**,tools/**"
          /d:sonar.qualitygate.wait=true

      - name: Restore
        run: dotnet restore ExecucaoService.sln

      - name: Build
        run: dotnet build ExecucaoService.sln --configuration Release --no-restore

      - name: Testes automatizados (unidade, API, BDD e integração)
        run: >
          dotnet test ExecucaoService.sln --configuration Release --no-build --verbosity normal
          --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Relatório de cobertura
        if: always()
        run: |
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/relatorio \
            -reporttypes:"Cobertura;MarkdownSummaryGithub;Html"
          cat coverage/relatorio/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Cobertura mínima de ${{ env.COBERTURA_MINIMA }}%
        run: python3 scripts/verificar-cobertura.py coverage/relatorio/Cobertura.xml "$COBERTURA_MINIMA"

      # Com sonar.qualitygate.wait, este passo falha se o quality gate reprovar.
      - name: Fim da análise e quality gate do SonarCloud
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publica os resultados de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura
          path: |
            coverage/**/coverage.cobertura.xml
            coverage/**/coverage.opencover.xml
            coverage/relatorio/
          if-no-files-found: ignore

  # Fora da publicação (PR, outras branches ou PUBLICAR_AWS desligada): só confere que a imagem builda.
  docker-build:
    name: Build da imagem Docker
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: build-and-test
    if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLICAR_AWS == 'true')"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build da imagem (sem push)
        run: docker build -f src/ExecucaoService.API/Dockerfile -t execucao-service:${{ github.sha }} .

  # Confirma que a role de OIDC (criada pelo Terraform do ExecucaoProducao-InfraKubernete) já
  # existe. Sem isso, um push na main antes do primeiro apply falharia com erro de credencial
  # em vez de pular a publicação com uma mensagem clara.
  check-infra-ready:
    name: Verifica se a role de OIDC já foi provisionada
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLICAR_AWS == 'true'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Configura credenciais AWS (chave estática do terraform-deployer)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checa a role do GitHub Actions da Execução
        id: check
        run: |
          ROLE_NAME="${PROJECT_NAME}-${ENVIRONMENT}-execucao-github-actions"
          if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Role '$ROLE_NAME' ainda não existe. Rode o Terraform (apply) do ExecucaoProducao-InfraKubernete primeiro. Pulando a publicação da imagem."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  # Push na main: build e push da imagem no ECR e disparo do deploy.
  docker-build-push:
    name: Build e push da imagem no ECR
    permissions:
      contents: read
      # OIDC do GitHub para assumir a role da AWS (sem access keys estáticas).
      id-token: write
    needs: [build-and-test, check-infra-ready]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-infra-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configura credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build e push da imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/ExecucaoService.API/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O GITHUB_TOKEN deste workflow não dispara workflows em outro repositório, então o
      # disparo usa um token dedicado (fine-grained, só o ExecucaoProducao-InfraKubernete,
      # permissão Contents: read/write). Sem ele, a imagem fica publicada e o aviso diz
      # para rodar o deploy à mão.
      - name: Dispara o deploy no cluster
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.EXECUCAO_INFRA_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$INFRA_DISPATCH_TOKEN" ]; then
            echo "::notice::Imagem publicada com a tag $IMAGE_TAG. Sem EXECUCAO_INFRA_DISPATCH_TOKEN, rode o workflow de deploy em https://github.com/Fiap-Mecanic-Ltda/ExecucaoProducao-InfraKubernete/actions"
            exit 0
          fi

          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $INFRA_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Fiap-Mecanic-Ltda/ExecucaoProducao-InfraKubernete/dispatches" \
            -d "{\"event_type\":\"imagem-publicada\",\"client_payload\":{\"image_tag\":\"$IMAGE_TAG\"}}"

          echo "::notice::Deploy da tag $IMAGE_TAG disparado em Fiap-Mecanic-Ltda/ExecucaoProducao-InfraKubernete."
